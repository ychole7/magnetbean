/* V5 · approved mascot applied without changing V2 movement timing */
.player .mascot-svg{display:block;width:112%;height:112%;overflow:visible;filter:drop-shadow(0 1px 1px #3c3a5020);transition:transform .13s cubic-bezier(.18,.85,.25,1)}
.player .mascot-svg text{pointer-events:none}
.player .mascot-svg .active-pole{transform-box:fill-box;transform-origin:center;animation:polarGlow .36s ease-out}
.player.pole-s .mascot-svg{transform:scaleX(-1)}
.player.pole-s .mascot-svg text{transform-box:fill-box;transform-origin:center;transform:scaleX(-1)}
.player.pole-s .mascot-svg .mascot-star{filter:drop-shadow(0 0 3px #67aaff)}
.player.pole-n .mascot-svg .mascot-star{filter:drop-shadow(0 0 3px #ff9b7c)}
@keyframes polarGlow{50%{filter:brightness(1.2)}}
.brand .brand-avatar{width:38px;height:38px;flex:none;display:block;overflow:visible}
.win-mascot{width:134px;max-width:50%;margin:-12px auto -4px;display:block;filter:drop-shadow(0 5px 6px #31335418)}
.win-mascot .mascot-svg{display:block;width:100%;height:auto;animation:mascotCheer .6s cubic-bezier(.2,1.2,.4,1) both}

@media(max-width:390px){.player .mascot-svg{width:111%;height:111%}.brand-title{font-size:19px}}


/* V6 unified mascot UI */
:root{--ink:#353052;--muted:#8880ab;--cream:#f7f3ff;--outline:#e1d9f4;--green:#7159cf}
body{background:radial-gradient(ellipse at 50% 0%,#ffffff 0%,#f6f2ff 45%,#eee9fc 100%)}
.app{max-width:500px}.brand{border:0;background:transparent;padding:0;text-align:left;cursor:pointer}.brand-title{color:#49388f;letter-spacing:-.8px}.brand-sub{color:#9686c7}.small-btn{background:#fff;border-color:#ded6f6;color:#6b55b4;box-shadow:0 3px 0 #e1d9f7}.eyebrow{color:#9c8bd3}.steps{border-color:#e4dcf9;box-shadow:0 4px 0 #ded4f2}.steps .count{color:#5c47af}.shell{background:#e6dafa;border-color:#fbf7ff;box-shadow:0 7px 0 #d2c1ed,0 15px 29px #61529b28}.board{background:#c7b5df}.cell{background:#fff9ec}.cell:nth-child(odd){background:#fffdf5}.hint-strip{color:#72649e}.hint-strip .dot{background:#9a83ef}.control{background:#fffefa;border-color:#e4daf6;box-shadow:0 5px 0 #dcd0ef}.control.flip{background:linear-gradient(120deg,#f7647b,#7361e9);border-color:#8c5ac9;box-shadow:0 5px 0 #6955b2}.footer{color:#8a80a9}.modal{background:#fffafa;box-shadow:0 18px 0 #4c397422,0 25px 60px #241b4b55}.primary{background:linear-gradient(120deg,#846ae7,#634bd0);box-shadow:0 4px 0 #4d3aaf}.secondary{background:#f0eafb;box-shadow:0 4px 0 #d7cbed}.level-btn{background:#f0eafa;border:2px solid #ede4ff;color:#574992}.level-btn.current{border-color:#9d7af2;background:#e9dffe}.level-btn.locked{opacity:.48}.tutorial-card{background:#f4efff;color:#70608e}.notification{background:#51428e}
.player .mascot-art{display:block;width:110%;height:110%;object-fit:contain;filter:drop-shadow(0 3px 2px #62526b35);user-select:none;transition:transform .13s cubic-bezier(.18,.85,.25,1)}

.brand-avatar .mascot-art{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 2px #7363ad33)}

@keyframes winBounce{from{transform:translateY(24px) scale(.6)}to{transform:translateY(0) scale(1)}}
.stage-head{display:flex;align-items:center;gap:9px;margin:18px 0 7px;color:#6b54bd;font-size:12px;font-weight:900}.stage-head:after{content:'';height:1px;flex:1;background:#ddd4f4}.stage-head:first-of-type{margin-top:8px}.levels-grid{margin:8px 0 12px}.level-btn .tiny{color:#e9aa39}.modal h2{color:#4e3b95}.modal p{color:#8b7fa9}
.home-screen{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 18%,#fff 0%,#f5f0ff 51%,#e9e4ff 100%);overflow:auto;display:flex;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}

/* V7 · motion polish: effects are decorative, puzzle timing is unchanged */
.player.step-motion .mascot-art{animation:magnetHop .16s cubic-bezier(.15,.8,.3,1) both}
.player.flip-motion .mascot-art{animation:magnetFlip .16s ease-out both}
@keyframes magnetHop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-5px) scale(1.08,.94)}80%{transform:translateY(1px) scale(.96,1.05)}100%{transform:translateY(0) scale(1)}}

 <header class="shop85-top"><button class="shop85-back" id="shop85Back" aria-label="스테이지 선택으로">‹</button><strong class="shop85-title">🛍️ 자석콩 상점</strong><div class="shop85-wallet" aria-label="보유 코인">🪙 ${fmt(saved.coins)}</div></header>
 <div class="shop85-hero"><img class="shop85-mascot" src="assets/jaseogi.png" alt="자석이"><div class="shop85-talk">자석콩을 더 특별하게 꾸며보세요! ✨</div></div>
 <nav class="shop85-tabs" aria-label="상점 카테고리"><button data-tab="skin" class="shop85-tab ${tab==='skin'?'active':''}">👕 스킨</button><button data-tab="theme" class="shop85-tab ${tab==='theme'?'active':''}">▦ 보드 테마</button><button data-tab="item" class="shop85-tab ${tab==='item'?'active':''}">💡 아이템</button></nav>
 <section class="shop85-panel"><h2>${tab==='skin'?'자석이 스킨':tab==='theme'?'보드 테마':'퍼즐 아이템'}</h2><p class="shop85-desc">${subtitle}</p><div class="${tab==='item'?'':'shop85-products'}">${products}</div></section>
 <p class="shop85-note">구매한 꾸미기는 영구 보유하고 언제든 무료로 교체할 수 있어요.<br>코인과 보유 기록은 이 브라우저에 저장돼요.</p>
 </div></section>`;
 document.getElementById('shop85Back').onclick=()=>showLevels(stageHubWorld);
 for(const button of overlay.querySelectorAll('[data-tab]'))button.onclick=()=>showShop(button.dataset.tab);
 for(const button of overlay.querySelectorAll('[data-product]'))button.onclick=()=>buyOrEquip(button.dataset.category,button.dataset.product);
 for(const button of overlay.querySelectorAll('[data-item-buy]'))button.onclick=()=>buyItem(button.dataset.itemBuy);
}
function buyOrEquip(category,id){
 const product=SHOP_PRODUCTS[category]?.find(item=>item.id===id);
 if(!product)return;
 if(!saved.shopOwned[category].includes(id)){
  if(saved.coins<product.price){toast('코인이 부족해요! 퍼즐에서 별을 모아보세요.');return}
  // Purchase and item ownership are committed together before refreshing the UI.
  saved.coins-=product.price;
  saved.shopOwned[category].push(id);
  save();
  toast(product.name+' 구매 완료!');
 }
 if(category==='skin')saved.equippedSkin=id;
 else saved.equippedTheme=id;
 applyCosmetics();save();showShop(category);
}
const V9_ITEMS={
 hint:{name:'힌트',icon:'?',price:100,detail:'현재 판에서 클리어로 이어지는 다음 행동 안내'},
 remote:{name:'극성 리모컨',icon:'N/S',price:200,detail:'구슬 하나의 N/S극을 반전'},
 booster:{name:'자력 부스터',icon:'➜',price:300,detail:'구슬 하나를 직선 방향으로 밀기'}
};
function buyItem(kind){
 const item=V9_ITEMS[kind];if(!item)return;
 if(saved.coins<item.price){toast('코인이 부족해요');return}
 saved.coins-=item.price;saved.inventory[kind]++;save();updateHud();showShop('item');toast(item.name+' 1개 구매 완료!');
}
// Compact, consistent line icons for consumable items (no external font or image requests).
const ITEM_ICONS={
 hint:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4"/><path d="M8.6 14.6a7 7 0 1 1 6.8 0c-.8.6-1.4 1.4-1.4 2.4h-4c0-1-.6-1.8-1.4-2.4Z"/></svg>',
 remote:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8a5 5 0 0 0 10 0V3"/><path d="M7 3h4v5H7zm6 0h4v5h-4"/><path d="m4 18 3-3 3 3m-3-3v6"/><path d="m20 18-3 3-3-3m3 3v-6"/></svg>',
 booster:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h14"/><path d="m12 7 5 5-5 5"/><path d="M20 5v14"/><path d="M3 8h4M3 16h4"/></svg>'
};
function renderItemButtons(){
 const box=document.getElementById('gameItems');if(!box)return;
 box.innerHTML=Object.entries(V9_ITEMS).map(([kind,item])=>`<button class="v9-item ${itemMode===kind?'active':''}" type="button" data-use-item="${kind}" ${busy||lock?'disabled':''}><span class="v9-icon">${ITEM_ICONS[kind]}</span><span class="v9-item-name">${item.name}</span><small>${saved.inventory[kind]}개</small></button>`).join('');
 for(const btn of box.querySelectorAll('[data-use-item]'))btn.onclick=()=>startItem(btn.dataset.useItem);
}
function renderItemMode(){
 const bar=document.getElementById('itemMode');if(!bar)return;
 if(!itemMode){bar.hidden=true;bar.replaceChildren();renderItemButtons();return}
 bar.hidden=false;
 const name=V9_ITEMS[itemMode].name;
 const selectHint=itemSelection===null?'게임판의 구슬을 하나 탭해 주세요.':`선택 구슬 ${itemSelection+1}번`;
 bar.innerHTML=`<div>${name} · ${selectHint}</div>${itemMode==='booster'&&itemSelection!==null?'<div class="v9-direction"><button data-dir="0">↑</button><button data-dir="3">←</button><button data-dir="1">→</button><button data-dir="2">↓</button></div>':''}<button class="v9-cancel" id="v9Cancel">취소</button>`;
 document.getElementById('v9Cancel').onclick=cancelItem;
 for(const btn of bar.querySelectorAll('[data-dir]'))btn.onclick=()=>useBooster(Number(btn.dataset.dir));
 renderItemButtons();
}
function cancelItem(){itemMode=null;itemSelection=null;renderItemMode();if(state)render(false)}
function startItem(kind){
 if(busy||lock)return;
 if(saved.inventory[kind]<=0){toast('상점에서 '+V9_ITEMS[kind].name+'을 구매해 주세요');return}
 if(kind==='hint'){useHint();return}
 itemMode=kind;itemSelection=null;renderItemMode();render(false);
}
function solveNextAction(){
 if(state.moves===0&&state.player===LEVELS[levelIndex].player&&state.mag===LEVELS[levelIndex].mag&&state.filled.length===0&&state.balls.every((p,i)=>p===LEVELS[levelIndex].balls[i])&&state.pols.every((p,i)=>p===LEVELS[levelIndex].pols[i])){
  const solution=LEVELS[levelIndex].solution;
  const map={U:0,R:1,D:2,L:3,F:4};return map[solution[0]];
 }
 const lvl=LEVELS[levelIndex],encode=s=>[s.player,s.mag,s.balls.join(','),s.pols.join(''),s.filled.slice().sort().join(',')].join('|');
 const queue=[{s:copy(state),first:-1}],seen=new Set([encode(state)]);let head=0;
 while(head<queue.length&&head<65000){
  const node=queue[head++];
  if(node.s.filled.length===lvl.balls.length)return node.first;
  for(let a=0;a<5;a++){
   const next=nextState(node.s,a,lvl);if(!next)continue;
   const key=encode(next.state);if(seen.has(key))continue;
   seen.add(key);queue.push({s:next.state,first:node.first===-1?a:node.first});
  }
 }
 return null;
}
function useHint(){
 if(busy||lock||saved.inventory.hint<1)return;
 const a=solveNextAction();
 if(a===null||a===undefined){toast('지금 상태에서 해답을 찾지 못했어요. 되돌리기를 이용해 보세요');return}
 saved.inventory.hint--;hintUsedRun=true;save();renderItemButtons();
 const name=['위로 ↑','오른쪽으로 →','아래로 ↓','왼쪽으로 ←','극성 전환 ⇄'][a];
 document.getElementById('description').textContent=`💡 추천: ${name} (힌트 1개 사용)`;
 toast('💡 다음 행동: '+name);
}
function pickBallAt(pos){
 if(!itemMode||itemSelection!==null&&itemMode==='remote')return false;
 const ball=state.balls.findIndex((p,i)=>p===pos&&!state.filled.includes(i));
 if(ball<0){toast('구슬을 선택해 주세요');return true}
 itemSelection=ball;
 if(itemMode==='remote')useRemote();else{renderItemMode();render(false)}
 return true;
}
function consumeSpecial(kind){
 if(saved.inventory[kind]<1)return false;
 saved.inventory[kind]--;assistedRun=true;save();return true;
}
function useRemote(){
 if(itemMode!=='remote'||itemSelection===null||busy||lock)return;
 if(!consumeSpecial('remote')){cancelItem();return}
 history.push(copy(state));state.pols[itemSelection]=1-state.pols[itemSelection];
 itemMode=null;itemSelection=null;renderItemMode();render();renderItemButtons();sfx('flip');haptic(12);toast('🧲 구슬의 극이 바뀌었어요!');
}
function useBooster(dir){
 if(itemMode!=='booster'||itemSelection===null||busy||lock)return;
 const i=itemSelection,[dr,dc]=DIRS[dir],lvl=LEVELS[levelIndex];
 let r=Math.floor(state.balls[i]/6),c=state.balls[i]%6,pos=state.balls[i],next=pos;
 while(true){const nr=r+dr,nc=c+dc;if(nr<0||nr>=6||nc<0||nc>=6)break;
  const dest=nr*6+nc;if(lvl.walls.includes(dest)||dest===state.player||state.balls.some((p,j)=>j!==i&&!state.filled.includes(j)&&p===dest))break;
  next=dest;pos=dest;r=nr;c=nc;
  if(lvl.goals.includes(dest)&&!state.filled.some(j=>state.balls[j]===dest))break;
 }
 if(next===state.balls[i]){toast('그 방향은 막혀 있어요. 다른 방향을 선택해 주세요');return}
 if(!consumeSpecial('booster')){cancelItem();return}
 history.push(copy(state));state.balls[i]=next;
 if(lvl.goals.includes(next)&&!state.filled.some(j=>state.balls[j]===next))state.filled.push(i);
 itemMode=null;itemSelection=null;renderItemMode();render(true,[i]);renderItemButtons();sfx('push');haptic([12,24,12]);toast('⚡ 자력 부스터 사용!');
 if(state.filled.length===lvl.balls.length){busy=true;lock=true;setTimeout(()=>{busy=false;showWin()},300)}
}
function showInfo(type){
  const contents={
    settings:settingsMarkup(),
    rewards:`<h2>🎁 보상 안내</h2><p>한 스테이지에서 획득한 최고 별 등급만큼 코인을 받아요.</p><div class="tutorial-card">⭐ 1성: 총 20코인<br>⭐⭐ 2성: 총 30코인<br>⭐⭐⭐ 3성: 총 50코인</div><p>1성에서 3성으로 갱신하면 차액 30코인을 추가로 받아요. 이미 얻은 보상은 중복되지 않아요.</p><div class="tutorial-card">점수: 1성 1,200점 · 2성 1,700점 · 3성 2,200점<br>점수는 스테이지별 최고 기록만 합산돼요.</div>`,
    shop:`<h2>🛍️ 상점 준비 중</h2><p>코인을 모아두세요! 다음 버전에서는 힌트와 자석 아이템을 추가할 예정이에요.</p><div class="tutorial-card">🪙 현재 보유: ${fmt(saved.coins)}코인<br>💡 힌트 · 🧲 극성 리모컨 · ✨ 자력 부스터 (추후 도입)</div><p>이번 V8에는 구매나 차감 기능이 없어요.</p>`,
    records:`<h2>📊 나의 기록</h2><div class="v8-inline"><span>🏆 누적 점수</span><strong>${fmt(saved.totalScore)}점</strong></div><div class="v8-inline"><span>⭐ 획득 별</span><strong>${fmt(starTotal())}개</strong></div><div class="v8-inline"><span>🧩 클리어 단계</span><strong>${completedCount()}/${LEVELS.length}</strong></div><div class="v8-inline"><span>🪙 보유 코인</span><strong>${fmt(saved.coins)}개</strong></div><p>최고 기록은 이 브라우저에 자동 저장돼요. 앱 데이터를 삭제하거나 다른 기기로 옮기면 기록이 공유되지 않아요.</p>`
  };
  overlay.innerHTML=`<div class="modal-back" id="infoBack"><div class="modal v8-info"><button class="close" id="infoClose" aria-label="닫기">✕</button>${contents[type]}<div class="modal-actions"><button class="primary" id="infoHome">홈으로</button></div></div></div>`;
  if(type==='settings'){for(const key of ['sound','haptic'])document.getElementById('pref-'+key).onclick=()=>changePreference(key,!saved.preferences[key])}
  document.getElementById('infoClose').onclick=showHome;
  document.getElementById('infoHome').onclick=showHome;
  document.getElementById('infoBack').onclick=e=>{if(e.target.id==='infoBack')showHome()};
}
document.getElementById('homeBtn').onclick=showHome;
showHome();
</script>
