/* V5 · approved mascot applied without changing V2 movement timing */
.player .mascot-svg{display:block;width:112%;height:112%;overflow:visible;filter:drop-shadow(0 1px 1px #3c3a5020);transition:transform .13s cubic-bezier(.18,.85,.25,1)}

.player.pole-s .mascot-svg{transform:scaleX(-1)}
.player.pole-s .mascot-svg text{transform-box:fill-box;transform-origin:center;transform:scaleX(-1)}
.player.pole-s .mascot-svg .mascot-star{filter:drop-shadow(0 0 3px #67aaff)}

.brand .brand-avatar{width:38px;height:38px;flex:none;display:block;overflow:visible}
.win-mascot{width:134px;max-width:50%;margin:-12px auto -4px;display:block;filter:drop-shadow(0 5px 6px #31335418)}

/* V6 unified mascot UI */
:root{--ink:#353052;--muted:#8880ab;--cream:#f7f3ff;--outline:#e1d9f4;--green:#7159cf}

.player .mascot-art{display:block;width:110%;height:110%;object-fit:contain;filter:drop-shadow(0 3px 2px #62526b35);user-select:none;transition:transform .13s cubic-bezier(.18,.85,.25,1)}

.player:after{content:'N';position:absolute;right:-2px;bottom:-3px;background:#ff7186;color:white;font-weight:900;font-size:10px;line-height:17px;width:18px;height:18px;border-radius:50%;border:2px solid white;box-shadow:0 2px 3px #51447744;z-index:4}

.home-screen{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 18%,#fff 0%,#f5f0ff 51%,#e9e4ff 100%);overflow:auto;display:flex;justify-content:center;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
.home-inner{width:min(100%,440px);min-height: min(800px,calc(100dvh - 48px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:5px}.home-kicker{font-size:13px;font-weight:900;letter-spacing:2.6px;color:#9380d6}.home-title{font-size:clamp(48px,13vw,67px);line-height:1.18;letter-spacing:-4px;font-weight:1000;color:#5540b7;text-shadow:0 5px 0 #ded5ff;margin:5px 0 0}.home-copy{color:#7d6daa;font-size:14px;font-weight:800;margin:0 0 9px}.hero-ring{position:relative;width:min(75vw,330px);aspect-ratio:1;display:grid;place-items:center;margin:10px 0 15px;background:radial-gradient(circle,#fff8fc 15%,#eee5ff 60%,#e9defc00 73%)}.hero-ring:before,.hero-ring:after{content:'✦';position:absolute;color:#ffbc43;font-size:35px;top:18%;left:4%}.hero-ring:after{color:#8f78e8;font-size:23px;left:auto;right:6%;top:70%}.home-hero{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 13px #5843b02c);animation:homeFloat 3.1s ease-in-out infinite}@keyframes homeFloat{50%{transform:translateY(-9px)}}.home-cta{width:min(100%,335px);padding:16px;border-radius:21px;font-size:19px;font-weight:900;color:white;background:linear-gradient(120deg,#ff6b86 0%,#ec627f 45%,#7762e7 100%);box-shadow:0 6px 0 #a955b9}.home-secondary{width:min(100%,335px);padding:14px;border-radius:18px;font-size:15px;font-weight:900;color:#6852b7;background:#fff;border:2px solid #e4daf9;box-shadow:0 4px 0 #dcd0f4;margin-top:9px}.home-progress{margin-top:18px;font-size:12px;font-weight:800;color:#9989be}.home-actions{width:100%;display:flex;flex-direction:column;align-items:center}.home-cta:active,.home-secondary:active{transform:translateY(3px);box-shadow:0 2px 0 #bbb0e3}

.player.step-motion .mascot-art{animation:magnetHop .16s cubic-bezier(.15,.8,.3,1) both}

<script>
'use strict';

const LEVELS = [{"player":12,"mag":0,"balls":[14],"pols":[0],"goals":[17],"walls":[],"optimal":1,"solution":"R"},{"player":17,"mag":0,"balls":[14],"pols":[1],"goals":[15],"walls":[],"optimal":1,"solution":"L"},{"player":12,"mag":1,"balls":[14],"pols":[0],"goals":[17],"walls":[],"optimal":1,"solution":"F"},{"player":21,"mag":1,"balls":[35],"pols":[1],"goals":[30],"walls":[6,4],"optimal":8,"solution":"DDFURRDF"},{"player":23,"mag":1,"balls":[35,2],"pols":[1,0],"goals":[10,3],"walls":[14],"optimal":7,"solution":"UUUFLDL"},{"player":25,"mag":1,"balls":[7,1],"pols":[0,0],"goals":[5,9],"walls":[11,16],"optimal":6,"solution":"UFULUU"},{"player":21,"mag":0,"balls":[28,22],"pols":[1,0],"goals":[24,27],"walls":[2,1],"optimal":9,"solution":"DLRRDFRUF"},{"player":2,"mag":0,"balls":[12,27],"pols":[1,1],"goals":[14,5],"walls":[26,34,9],"optimal":10,"solution":"DDRLDFRRDR"},{"player":17,"mag":0,"balls":[11,34],"pols":[0,0],"goals":[18,8],"walls":[29,12,27,6],"optimal":11,"solution":"LULFDRRUFDD"},{"player":34,"mag":0,"balls":[35,31],"pols":[1,1],"goals":[25,21],"walls":[12,11,8,2],"optimal":9,"solution":"UUURLDLLL"},{"player":11,"mag":0,"balls":[1,8],"pols":[0,0],"goals":[23,0],"walls":[14,2],"optimal":11,"solution":"LDDDLLLFLFU"},{"player":22,"mag":1,"balls":[30,25],"pols":[1,1],"goals":[17,33],"walls":[10,16,1],"optimal":11,"solution":"RDFDLLUFRDR"},{"player":34,"mag":0,"balls":[29,6],"pols":[0,0],"goals":[18,17],"walls":[0,30,23],"optimal":13,"solution":"ULLLLFUUURLDF"},{"player":0,"mag":1,"balls":[13,25],"pols":[0,1],"goals":[22,23],"walls":[30,1,19,24],"optimal":13,"solution":"DDFRRRRDRDDFL"},{"player":7,"mag":0,"balls":[10,2],"pols":[0,1],"goals":[28,31],"walls":[1,15,5,19],"optimal":14,"solution":"DRDDDRUULFRRDD"},{"player":27,"mag":0,"balls":[8,25,29],"pols":[0,0,1],"goals":[5,32,7],"walls":[24,1],"optimal":12,"solution":"RDRFLLUUUUFL"},{"player":2,"mag":1,"balls":[32,35,25],"pols":[0,1,1],"goals":[19,20,26],"walls":[29,27,11],"optimal":11,"solution":"DDLFDDDUUUR"},{"player":10,"mag":1,"balls":[27,4,18],"pols":[1,0,1],"goals":[1,0,20],"walls":[15,32,8],"optimal":14,"solution":"RUFDDDDFLLLLDL"},{"player":0,"mag":1,"balls":[10,22,12],"pols":[0,0,0],"goals":[35,21,9],"walls":[26,5,4,28],"optimal":13,"solution":"RRDRDRULFDURR"},{"player":13,"mag":1,"balls":[0,2,25],"pols":[0,1,1],"goals":[11,10,12],"walls":[16,1,29,30,5],"optimal":14,"solution":"RFLULFDFDRFLUU"}];
const TITLES=["첫 번째 끌림","방향을 찾아서","구슬의 여행","극성 스위치","두 개의 구슬","엇갈린 마음","벽을 활용해","작은 연쇄","자석의 묘수","마지막 실험","한 번 더 생각해","서로 다른 방향","벽 너머의 선택","자리 바꾸기","극성의 비밀","세 구슬의 등장","하나씩 차근차근","동시 반응","복잡한 실험","세 구슬 마스터"];
const DESCRIPTIONS=["다른 극끼리는 끌어당겨요.","같은 극끼리는 밀어내요.","벽에 닿으면 구슬이 멈춰요.","N과 S를 바꿔서 길을 찾아요.","모든 구슬을 구멍에 넣어보세요.","극이 다른 두 구슬을 조심하세요.","벽과 구슬의 위치를 활용하세요.","여러 구슬의 반응을 예측하세요.","적은 턴으로 클리어해 보세요.","마지막 실험에 도전하세요!","같은 행동이라도 위치에 따라 결과가 달라져요.","구슬 두 개의 움직임을 함께 생각하세요.","벽이 멈추는 지점을 만들어 줘요.","먼저 움직일 구슬을 골라보세요.","N과 S의 조합으로 길을 열어요.","이제 세 구슬을 모두 넣어보세요!","서로 가로막지 않도록 순서를 정해요.","한 번의 펄스가 여러 구슬을 움직여요.","막혔다면 극을 바꾸고 다시 생각해요.","세 구슬을 모두 넣고 연구를 완성하세요!"];
const DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
const board=document.getElementById('board'),overlay=document.getElementById('overlay');
let levelIndex=0, state,history=[],busy=false,lock=false;
const SAVE_KEY='magnetkong-save';
let saved={unlocked:1,stars:{},coins:0,bestScores:{},bestTurns:{},totalScore:0,saveVersion:8};
try{
  const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||'{}');
  if(raw&&typeof raw==='object'){
    saved.unlocked=Math.max(1,Math.min(LEVELS.length,Math.floor(Number(raw.unlocked)||1)));
    if(raw.stars&&typeof raw.stars==='object')for(const [k,v] of Object.entries(raw.stars)){
      const i=Number(k);if(Number.isInteger(i)&&i>=0&&i<LEVELS.length)saved.stars[i]=Math.max(0,Math.min(3,Math.floor(Number(v)||0)));
    }
    if(raw.bestScores&&typeof raw.bestScores==='object')for(const [k,v] of Object.entries(raw.bestScores)){
      const i=Number(k);if(Number.isInteger(i)&&i>=0&&i<LEVELS.length)saved.bestScores[i]=Math.max(0,Math.floor(Number(v)||0));
    }
    if(raw.bestTurns&&typeof raw.bestTurns==='object')for(const [k,v] of Object.entries(raw.bestTurns)){
      const i=Number(k);if(Number.isInteger(i)&&i>=0&&i<LEVELS.length&&Number(v)>0)saved.bestTurns[i]=Math.floor(Number(v));
    }
    saved.coins=Math.max(0,Math.floor(Number(raw.coins)||0));
    // Legacy saves retain stars and stage unlocks. Existing clears do not generate retroactive coins.
    for(const [k,v] of Object.entries(saved.stars))saved.bestScores[k]=Math.max(saved.bestScores[k]||0,scoreForStars(v));
    saved.totalScore=Object.values(saved.bestScores).reduce((a,b)=>a+b,0);
  }
}catch(e){console.warn('저장 데이터를 읽지 못했습니다.',e)}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(saved))}catch(e){console.warn('저장 실패',e)}}
function scoreForStars(n){return n>0?1000+500*(n-1)+200:0}
function coinForStars(n){return [0,20,30,50][n]||0}
function fmt(n){return Number(n||0).toLocaleString('ko-KR')}
function starTotal(){return Object.values(saved.stars).reduce((a,b)=>a+b,0)}
function completedCount(){return Object.values(saved.stars).filter(v=>v>0).length}
function updateHud(){const coins=document.getElementById('gameCoins');const score=document.getElementById('gameScore');if(coins)coins.textContent='🪙 '+fmt(saved.coins);if(score)score.textContent='🏆 '+fmt(saved.totalScore)+'점'}
function awardClear(stars){
  const prev=saved.stars[levelIndex]||0;
  const oldScore=saved.bestScores[levelIndex]||0;
  const nextStars=Math.max(prev,stars);
  const newScore=Math.max(oldScore,scoreForStars(nextStars));
  const gainedCoins=Math.max(0,coinForStars(nextStars)-coinForStars(prev));
  const gainedScore=newScore-oldScore;
  saved.stars[levelIndex]=nextStars;
  saved.bestScores[levelIndex]=newScore;
  saved.coins+=gainedCoins;
  saved.totalScore+=gainedScore;
  saved.bestTurns[levelIndex]=Math.min(saved.bestTurns[levelIndex]||Infinity,state.moves);
  saved.unlocked=Math.max(saved.unlocked,Math.min(levelIndex+2,LEVELS.length));
  save();updateHud();
  return {gainedCoins,gainedScore,prev,newStars:nextStars};
}
function initial(l){return {player:l.player,mag:l.mag,balls:l.balls.slice(),filled:[],moves:0}}
function copy(s){return {player:s.player,mag:s.mag,balls:s.balls.slice(),filled:s.filled.slice(),moves:s.moves}}
function position(element,pos){element.style.setProperty('--row',Math.floor(pos/6));element.style.setProperty('--col',pos%6)}
let pieces=[];
function createPiece(kind,index,pol){let el=document.createElement('div');el.className='piece '+(kind==='player'?'player':'ball');if(kind==='player')el.innerHTML=MASCOT_SVG;else el.innerHTML=`<div class="orb ${pol?'s':'n'}">${pol?'S':'N'}</div>`;el.dataset.index=index;if(kind==='player')el.setAttribute('aria-label','자석이 캐릭터 · 탭하여 극 바꾸기');document.getElementById('pieces').append(el);pieces.push(el);if(kind==='player')el.addEventListener('click',e=>{e.stopPropagation();act(4)});return el}
function loadLevel(idx){if(idx<0||idx>=LEVELS.length||idx>=saved.unlocked)return;levelIndex=idx;updateHud();state=initial(LEVELS[idx]);history=[];busy=false;lock=false;overlay.replaceChildren();document.getElementById('world').textContent='WORLD 01 · 자력 실험실';document.getElementById('stageNum').textContent=idx+1;document.getElementById('turnTarget').textContent=' / '+LEVELS[idx].optimal;document.getElementById('levelTitle').textContent=TITLES[idx];document.getElementById('description').textContent=DESCRIPTIONS[idx];board.replaceChildren();for(let i=0;i<36;i++){let el=document.createElement('div');el.className='cell';if(LEVELS[idx].walls.includes(i))el.classList.add('wall');if(LEVELS[idx].goals.includes(i))el.classList.add('goal');el.dataset.pos=i;board.append(el)}let layer=document.createElement('div');layer.className='pieces';layer.id='pieces';board.append(layer);pieces=[];createPiece('player',-1);LEVELS[idx].balls.forEach((_,i)=>createPiece('ball',i,LEVELS[idx].pols[i]));render(false)}
function render(animated=true,activated=[]){document.getElementById('moves').textContent=state.moves;const predicted=state.moves<=LEVELS[levelIndex].optimal+1?3:state.moves<=LEVELS[levelIndex].optimal+4?2:1;const meter=document.getElementById('starMeter');meter.setAttribute('aria-label','현재 예상 별 '+predicted+'개');[...meter.children].forEach((star,i)=>star.classList.toggle('lost',i>=predicted));document.getElementById('undo').disabled=!history.length||busy;const els=board.querySelectorAll('.cell');els.forEach((el,i)=>{el.classList.toggle('filled',state.filled.some(j=>state.balls[j]===i))});pieces.forEach((el,i)=>{const isPlayer=i===0;const ballIdx=i-1;if(!animated)el.style.transition='none';position(el,isPlayer?state.player:state.balls[ballIdx]);el.classList.toggle('disappear',!isPlayer&&state.filled.includes(ballIdx));el.classList.toggle('activated',!isPlayer&&activated.includes(ballIdx));if(isPlayer){el.classList.toggle('pole-s',state.mag===1);el.classList.toggle('pole-n',state.mag===0)}if(!animated)requestAnimationFrame(()=>el.style.transition='')})}
function nextState(s,action,level){const t=copy(s),walls=new Set(level.walls),goals=new Set(level.goals);if(action===4)t.mag=1-t.mag;else{let [dr,dc]=DIRS[action],r=Math.floor(t.player/6)+dr,c=t.player%6+dc;if(r<0||r>=6||c<0||c>=6)return null;const newpos=r*6+c;if(walls.has(newpos)||t.balls.some((x,i)=>!t.filled.includes(i)&&x===newpos))return null;t.player=newpos}t.moves++;
const selected=[];for(const [dr,dc] of DIRS){let r=Math.floor(t.player/6)+dr,c=t.player%6+dc;while(r>=0&&r<6&&c>=0&&c<6){let pos=r*6+c;if(walls.has(pos))break;let i=t.balls.findIndex((x,j)=>x===pos&&!t.filled.includes(j));if(i!==-1){selected.push([i,dr,dc]);break}r+=dr;c+=dc}}
let moving=new Map(selected.map(([i,dr,dc])=>[i,level.pols[i]===t.mag?[dr,dc]:[-dr,-dc]]));const paths=Object.fromEntries(selected.map(([i])=>[i,[]]));for(let k=0;k<7;k++){let intent=new Map();for(const [i,[dr,dc]] of moving){const r=Math.floor(t.balls[i]/6)+dr,c=t.balls[i]%6+dc;if(r>=0&&r<6&&c>=0&&c<6){const pos=r*6+c;if(!walls.has(pos)&&pos!==t.player)intent.set(i,pos)}}let changed=true;while(changed){changed=false;const counts=new Map();for(const dest of intent.values())counts.set(dest,(counts.get(dest)||0)+1);for(const [i,dest] of intent){const other=t.balls.findIndex((x,j)=>j!==i&&!t.filled.includes(j)&&x===dest);if(counts.get(dest)>1||(other!==-1&&!intent.has(other))){intent.delete(i);changed=true}}}if(intent.size===0)break;const oldFilledGoals=new Set(t.filled.map(i=>t.balls[i]));for(const [i,dest] of intent){t.balls[i]=dest;paths[i].push(dest)}for(const [i,dest] of intent){if(goals.has(dest)&&!oldFilledGoals.has(dest))t.filled.push(i)}moving=new Map([...moving].filter(([i])=>intent.has(i)&&!t.filled.includes(i)))}return {state:t,active:selected.map(([i])=>i),paths}}
function effectAt(type,pos,text){const el=document.createElement('div');el.className=type;el.textContent=text||'';if(pos!==null){el.style.setProperty('--row',Math.floor(pos/6));el.style.setProperty('--col',pos%6)}board.append(el);setTimeout(()=>el.remove(),800)}
function pulseAt(pos){board.style.setProperty('--pulse-row',Math.floor(pos/6));board.style.setProperty('--pulse-col',pos%6);board.classList.remove('pulse-hit');void board.offsetWidth;board.classList.add('pulse-hit');setTimeout(()=>board.classList.remove('pulse-hit'),260)}
function movementPolish(action,output,before){
  const player=pieces[0];
  player.classList.remove('step-motion','flip-motion');
  // Restart the tiny movement animation on repeated taps; no additional input lock.
  void player.offsetWidth;
  player.classList.add(action===4?'flip-motion':'step-motion');
  setTimeout(()=>player.classList.remove('step-motion','flip-motion'),160);
  if(action===4){
    const bubble=document.createElement('span');
    bubble.className='pole-spark';bubble.textContent=state.mag===0?'N극!':'S극!';
    player.append(bubble);setTimeout(()=>bubble.remove(),230);
  }
  const width=board.clientWidth, cell=(width-10-5*4)/6, step=cell+4;
  const center=pos=>({x:5+cell/2+(pos%6)*step,y:5+cell/2+Math.floor(pos/6)*step});
  for(const [key,path] of Object.entries(output.paths)){
    if(!path.length)continue;
    const i=Number(key),a=center(before.balls[i]),b=center(path[path.length-1]);
    const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy);
    if(length<5)continue;
    const el=document.createElement('div');
    el.className='orb-trail '+(LEVELS[levelIndex].pols[i]?'s':'n');
    Object.assign(el.style,{left:a.x+'px',top:a.y+'px',width:Math.max(0,length-7)+'px',transform:`rotate(${Math.atan2(dy,dx)}rad)`});
    board.append(el);setTimeout(()=>el.remove(),240);
  }
}
function act(action){if(busy||lock)return;let output=nextState(state,action,LEVELS[levelIndex]);if(!output){toast('이쪽으로는 이동할 수 없어요');return}history.push(copy(state));const before=history[history.length-1];state=output.state;busy=true;render(true,output.active);movementPolish(action,output,before);pulseAt(state.player);
const newly=state.filled.filter(i=>!before.filled.includes(i));
if(output.active.length>=2)effectAt('multi-pop',null,`${output.active.length}개 동시 반응!`);
if(newly.length){setTimeout(()=>{for(const i of newly)effectAt('burst',state.balls[i],'✓')},120)}
if(navigator.vibrate)navigator.vibrate(newly.length?[14,35,18]:8);
setTimeout(()=>{busy=false;render(true);if(state.filled.length===LEVELS[levelIndex].balls.length){lock=true;setTimeout(showWin,250)}},165)}
function undo(){if(!history.length||busy||lock)return;state=history.pop();render()}
function reset(){if(busy)return;state=initial(LEVELS[levelIndex]);history=[];lock=false;overlay.replaceChildren();render()}
function starCount(){const ideal=LEVELS[levelIndex].optimal;return state.moves<=ideal+1?3:state.moves<=ideal+4?2:1}
function showWin(){
  const stars=starCount();
  const reward=awardClear(stars);
  const unlockNote=levelIndex===LEVELS.length-1?'모든 스테이지를 완료했어요!':'다음 스테이지가 열렸어요!';
  overlay.innerHTML=`<div class="modal-back"><div class="modal win"><div class="confetti">${Array.from({length:22},(_,i)=>`<i style="--x:${(i*37+9)%97}%;--c:${['#ef6b6d','#5a94df','#f2bb55','#53a187'][i%4]};--delay:${(i%6)*.042}s;--duration:${.65+(i%5)*.11}s;--rot:${i*29}deg;--drift:${(i%2?1:-1)*(10+i%4*8)}px"></i>`).join('')}</div><div class="win-mascot">${MASCOT_SVG}</div><h2>퍼즐 해결!</h2><div class="stars celebrate">${'★'.repeat(stars)}<span style="color:#e9e2d0">${'★'.repeat(3-stars)}</span></div><p><b>${state.moves}턴</b>에 성공! · 최소 ${LEVELS[levelIndex].optimal}턴<br>${unlockNote}</p><div class="v8-reward"><div>🪙 획득 코인<strong>+${fmt(reward.gainedCoins)}</strong></div><div>🏆 기록 점수<strong>+${fmt(reward.gainedScore)}</strong></div></div><div class="v8-reward-note">${reward.gainedCoins||reward.gainedScore?'최고 별 기록 보상을 받았어요!':'이미 받은 별 보상은 중복 지급되지 않아요.'}<br>보유 코인 ${fmt(saved.coins)} · 총 점수 ${fmt(saved.totalScore)}</div><div class="modal-actions"><button class="secondary" id="winRetry">다시 도전</button><button class="primary" id="winNext">${levelIndex===LEVELS.length-1?'스테이지 선택':'다음 스테이지 →'}</button></div></div></div>`;
  document.getElementById('winRetry').onclick=()=>loadLevel(levelIndex);
  document.getElementById('winNext').onclick=()=>levelIndex===LEVELS.length-1?showLevels():loadLevel(levelIndex+1);
}
let stageHubWorld=0;
function showLevels(world=stageHubWorld){
  if(busy)return;
  const fromHome=!!overlay.querySelector('.home-screen');
  stageHubWorld=world;
  const future=world>0;
  const total=LEVELS.length;
  const earned=starTotal();
  const maxStars=total*3;
  const playable=Array.from({length:20},(_,i)=>{
    if(future)return `<button class="stagehub-tile is-locked" disabled aria-label="추가 예정 스테이지"><span class="lock-symbol">🔒</span></button>`;
    const n=i+1,unlocked=i<saved.unlocked,stars=saved.stars[i]||0,next=unlocked&&!stars;
    const rating=stars?`<span class="stagehub-stars">${[1,2,3].map(k=>`<span class="${k<=stars?'earned':''}">★</span>`).join('')}</span>`:'<span class="stagehub-stars">☆☆☆</span>';
    return `<button class="stagehub-tile ${!unlocked?'is-locked':next?'is-next':''}" data-lv="${i}" ${!unlocked?'disabled':''} aria-label="${n}단계 ${!unlocked?'잠김':stars?stars+'성 완료':'플레이'}">${unlocked?n:'<span class="lock-symbol">🔒</span>'}${unlocked?rating:''}</button>`;
  }).join('');
  overlay.innerHTML=`<section class="stagehub" role="dialog" aria-modal="true" aria-label="스테이지 선택"><div class="stagehub-inner">
    <header class="stagehub-top"><button id="stageHubBack" class="stagehub-back" aria-label="홈으로">‹</button><div class="stagehub-name">자석콩 ✦</div><div class="stagehub-coins"><span class="stagehub-coin-icon">✦</span>${fmt(saved.coins)}</div></header>
    <div class="stagehub-world"><button class="stagehub-world-nav prev" id="worldPrev" ${world===0?'disabled':''} aria-label="이전 월드">‹</button><span class="stagehub-world-tag">WORLD ${world+1}</span><h2>${future?'새로운 연구실':'자력 실험실'}</h2><div class="stagehub-subtitle">${future?'다음 월드는 추후 업데이트 예정':'스테이지 1~20 · 마음껏 도전해요!'}</div><button class="stagehub-world-nav next" id="worldNext" ${world===1?'disabled':''} aria-label="다음 월드">›</button><div class="stagehub-progress"><span>⭐</span><span>${future?'준비 중':earned+' / '+maxStars}</span><div class="stagehub-progressbar"><i style="width:${future?0:earned/maxStars*100}%"></i></div></div></div>
    <main class="stagehub-lab"><div class="stagehub-grid">${playable}</div></main>
    <nav class="stagehub-bottom" aria-label="게임 메뉴"><button id="stageShop"><span>🛍️</span>상점</button><button id="stageRewards"><span>🎁</span>보상</button><button id="stageSettings"><span>⚙️</span>설정</button></nav><p class="stagehub-footnote">완료한 스테이지는 언제든 다시 플레이할 수 있어요.</p>
  </div></section>`;
  document.getElementById('stageHubBack').onclick=showHome;
  document.getElementById('worldPrev').onclick=()=>showLevels(0);
  document.getElementById('worldNext').onclick=()=>showLevels(1);
  for(const el of overlay.querySelectorAll('[data-lv]'))el.onclick=()=>loadLevel(Number(el.dataset.lv));
  [['stageShop','shop'],['stageRewards','rewards'],['stageSettings','settings']].forEach(([id,type])=>{
    document.getElementById(id).onclick=()=>{
      showInfo(type);
      for(const btnId of ['infoClose','infoHome'])document.getElementById(btnId).onclick=()=>{busy=false;showLevels(stageHubWorld)};
      document.getElementById('infoBack').onclick=e=>{if(e.target.id==='infoBack'){busy=false;showLevels(stageHubWorld)}};
    };
  });
}
let toastTimer;function toast(message){document.querySelector('.notification')?.remove();let el=document.createElement('div');el.className='notification';el.textContent=message;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),1900)}
let start=null;board.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,time:Date.now()}});board.addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>20){act(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))}else if(e.target.closest('.player')){}else{let rect=board.getBoundingClientRect(),gap=4,pad=5,unit=(rect.width-10-5*gap)/6;let col=Math.floor((e.clientX-rect.left-pad)/(unit+gap)),row=Math.floor((e.clientY-rect.top-pad)/(unit+gap)),pr=Math.floor(state.player/6),pc=state.player%6;let deltaR=row-pr,deltaC=col-pc;if(deltaR===0&&Math.abs(deltaC)===1)act(deltaC>0?1:3);else if(deltaC===0&&Math.abs(deltaR)===1)act(deltaR>0?2:0)}start=null});board.addEventListener('pointercancel',()=>start=null);
document.addEventListener('keydown',e=>{if(overlay.children.length)return;const map={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,' ':4,Enter:4};if(map[e.key]!==undefined){e.preventDefault();act(map[e.key])}else if(e.key==='Backspace'){e.preventDefault();undo()}else if(e.key==='r'||e.key==='R')reset()});document.getElementById('undo').onclick=undo;document.getElementById('flip').onclick=()=>act(4);document.getElementById('restart').onclick=reset;document.getElementById('selectLevel').onclick=()=>showLevels(0);

function showHome(){
  busy=false;lock=false;updateHud();
  overlay.innerHTML=`<div class="home-screen home-v81 home-simple" role="dialog" aria-label="자석콩 홈 화면"><div class="home-inner v81-inner">
    <div class="v81-title-wrap"><div class="v81-ribbon">✦ 자석 퍼즐 게임 ✦</div><h1 class="v81-logo">자석콩<span class="v81-logo-star">★</span></h1><div class="v81-logo-swoosh"></div></div>
    <div class="v81-stage" aria-hidden="true"><span class="v81-deco deco-left">✦</span><span class="v81-deco deco-right">✦</span><span class="v81-deco deco-puzzle">✿</span><div class="v81-mascot-halo"></div><img src="assets/jaseogi.png" alt="" class="v81-mascot"><div class="v81-mascot-shadow"></div><div class="v81-floor-ring"></div></div>
    <div class="v81-buttons"><button class="v81-start" id="homePlay"><span class="v81-play-icon">▶</span>게임시작</button></div>
    <div class="v81-grass v81-grass-left"></div><div class="v81-grass v81-grass-right"></div>
  </div></div>`;
  document.getElementById('homePlay').onclick=()=>showLevels(0);
}
function showInfo(type){
  const contents={
    settings:`<h2>⚙ 게임 안내</h2><p>자석콩 V8.1은 홈 화면 디자인을 새로 적용한 버전이에요.</p><div class="tutorial-card">🧲 자석을 한 칸 움직이거나 N/S극을 바꿔 구슬을 구멍에 넣어주세요.<br>❤️ 하트 제한 없이 자유롭게 플레이할 수 있어요.<br>💾 기록은 이 브라우저에 자동 저장돼요.</div><p>효과음과 진동 개별 설정은 추후 추가할 예정이에요.</p>`,
    rewards:`<h2>🎁 보상 안내</h2><p>한 스테이지에서 획득한 최고 별 등급만큼 코인을 받아요.</p><div class="tutorial-card">⭐ 1성: 총 20코인<br>⭐⭐ 2성: 총 30코인<br>⭐⭐⭐ 3성: 총 50코인</div><p>1성에서 3성으로 갱신하면 차액 30코인을 추가로 받아요. 이미 얻은 보상은 중복되지 않아요.</p><div class="tutorial-card">점수: 1성 1,200점 · 2성 1,700점 · 3성 2,200점<br>점수는 스테이지별 최고 기록만 합산돼요.</div>`,
    shop:`<h2>🛍️ 상점 준비 중</h2><p>코인을 모아두세요! 다음 버전에서는 힌트와 자석 아이템을 추가할 예정이에요.</p><div class="tutorial-card">🪙 현재 보유: ${fmt(saved.coins)}코인<br>💡 힌트 · 🧲 극성 리모컨 · ✨ 자력 부스터 (추후 도입)</div><p>이번 V8에는 구매나 차감 기능이 없어요.</p>`,
    records:`<h2>📊 나의 기록</h2><div class="v8-inline"><span>🏆 누적 점수</span><strong>${fmt(saved.totalScore)}점</strong></div><div class="v8-inline"><span>⭐ 획득 별</span><strong>${fmt(starTotal())}개</strong></div><div class="v8-inline"><span>🧩 클리어 단계</span><strong>${completedCount()}/${LEVELS.length}</strong></div><div class="v8-inline"><span>🪙 보유 코인</span><strong>${fmt(saved.coins)}개</strong></div><p>최고 기록은 이 브라우저에 자동 저장돼요. 앱 데이터를 삭제하거나 다른 기기로 옮기면 기록이 공유되지 않아요.</p>`
  };
  overlay.innerHTML=`<div class="modal-back" id="infoBack"><div class="modal v8-info"><button class="close" id="infoClose" aria-label="닫기">✕</button>${contents[type]}<div class="modal-actions"><button class="primary" id="infoHome">홈으로</button></div></div></div>`;
  document.getElementById('infoClose').onclick=showHome;
  document.getElementById('infoHome').onclick=showHome;
  document.getElementById('infoBack').onclick=e=>{if(e.target.id==='infoBack')showHome()};
}
document.getElementById('homeBtn').onclick=showHome;
showHome();
</script>
</body></html>
