/* V5 · approved mascot applied without changing V2 movement timing */

/* V6 unified mascot UI */

.app{max-width:500px}.brand{border:0;background:transparent;padding:0;text-align:left;cursor:pointer}.brand-title{color:#49388f;letter-spacing:-.8px}.brand-sub{color:#9686c7}.small-btn{background:#fff;border-color:#ded6f6;color:#6b55b4;box-shadow:0 3px 0 #e1d9f7}.eyebrow{color:#9c8bd3}.steps{border-color:#e4dcf9;box-shadow:0 4px 0 #ded4f2}.steps .count{color:#5c47af}.shell{background:#e6dafa;border-color:#fbf7ff;box-shadow:0 7px 0 #d2c1ed,0 15px 29px #61529b28}.board{background:#c7b5df}.cell{background:#fff9ec}.cell:nth-child(odd){background:#fffdf5}.hint-strip{color:#72649e}.hint-strip .dot{background:#9a83ef}.control{background:#fffefa;border-color:#e4daf6;box-shadow:0 5px 0 #dcd0ef}.control.flip{background:linear-gradient(120deg,#f7647b,#7361e9);border-color:#8c5ac9;box-shadow:0 5px 0 #6955b2}.footer{color:#8a80a9}.modal{background:#fffafa;box-shadow:0 18px 0 #4c397422,0 25px 60px #241b4b55}.primary{background:linear-gradient(120deg,#846ae7,#634bd0);box-shadow:0 4px 0 #4d3aaf}.secondary{background:#f0eafb;box-shadow:0 4px 0 #d7cbed}.level-btn{background:#f0eafa;border:2px solid #ede4ff;color:#574992}.level-btn.current{border-color:#9d7af2;background:#e9dffe}.level-btn.locked{opacity:.48}.tutorial-card{background:#f4efff;color:#70608e}.notification{background:#51428e}

<div class="app">
  <header class="top"><button class="brand" id="homeBtn" aria-label="타이틀 화면으로"><span class="brand-avatar" id="brandAvatar"></span><div><div class="brand-title">자석콩 <span style="font-size:13px">✦</span></div><div class="brand-sub">MAGNET PUZZLE</div></div></button><button class="small-btn" id="selectLevel">☷ 스테이지</button></header>
  <div class="heading"><div><div class="eyebrow" id="world">WORLD 01 · 자석 연구소</div><div class="level-title" id="levelTitle">첫 번째 끌림</div></div><div class="steps"><div class="count" id="moves">0</div><div class="caption">사용한 턴</div></div></div>

<script>

const DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
const board=document.getElementById('board'),overlay=document.getElementById('overlay');document.getElementById('brandAvatar').innerHTML=MASCOT_SVG;
let levelIndex=0, state,history=[],busy=false,lock=false,saved={unlocked:1,stars:{}};
try{saved=Object.assign(saved,JSON.parse(localStorage.getItem('magnetkong-save')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('magnetkong-save',JSON.stringify(saved))}catch(e){}}
function initial(l){return {player:l.player,mag:l.mag,balls:l.balls.slice(),filled:[],moves:0}}
function copy(s){return {player:s.player,mag:s.mag,balls:s.balls.slice(),filled:s.filled.slice(),moves:s.moves}}
function position(element,pos){element.style.setProperty('--row',Math.floor(pos/6));element.style.setProperty('--col',pos%6)}
let pieces=[];
function createPiece(kind,index,pol){let el=document.createElement('div');el.className='piece '+(kind==='player'?'player':'ball');if(kind==='player')el.innerHTML=MASCOT_SVG;else el.innerHTML=`<div class="orb ${pol?'s':'n'}">${pol?'S':'N'}</div>`;el.dataset.index=index;if(kind==='player')el.setAttribute('aria-label','자석이 캐릭터 · 탭하여 극 바꾸기');document.getElementById('pieces').append(el);pieces.push(el);if(kind==='player')el.addEventListener('click',e=>{e.stopPropagation();act(4)});return el}
function loadLevel(idx){if(idx<0||idx>=LEVELS.length||idx>=saved.unlocked)return;levelIndex=idx;state=initial(LEVELS[idx]);history=[];busy=false;lock=false;overlay.replaceChildren();document.getElementById('world').textContent=idx<10?'WORLD 01 · 자석 연구소':'WORLD 02 · 극성 실험실';document.getElementById('levelTitle').textContent=TITLES[idx];document.getElementById('description').textContent=DESCRIPTIONS[idx];board.replaceChildren();for(let i=0;i<36;i++){let el=document.createElement('div');el.className='cell';if(LEVELS[idx].walls.includes(i))el.classList.add('wall');if(LEVELS[idx].goals.includes(i))el.classList.add('goal');el.dataset.pos=i;board.append(el)}let layer=document.createElement('div');layer.className='pieces';layer.id='pieces';board.append(layer);pieces=[];createPiece('player',-1);LEVELS[idx].balls.forEach((_,i)=>createPiece('ball',i,LEVELS[idx].pols[i]));render(false)}
function render(animated=true,activated=[]){document.getElementById('moves').textContent=state.moves;document.getElementById('undo').disabled=!history.length||busy;const els=board.querySelectorAll('.cell');els.forEach((el,i)=>{el.classList.toggle('filled',state.filled.some(j=>state.balls[j]===i))});pieces.forEach((el,i)=>{const isPlayer=i===0;const ballIdx=i-1;if(!animated)el.style.transition='none';position(el,isPlayer?state.player:state.balls[ballIdx]);el.classList.toggle('disappear',!isPlayer&&state.filled.includes(ballIdx));el.classList.toggle('activated',!isPlayer&&activated.includes(ballIdx));if(isPlayer){el.classList.toggle('pole-s',state.mag===1);el.classList.toggle('pole-n',state.mag===0)}if(!animated)requestAnimationFrame(()=>el.style.transition='')})}
function nextState(s,action,level){const t=copy(s),walls=new Set(level.walls),goals=new Set(level.goals);if(action===4)t.mag=1-t.mag;else{let [dr,dc]=DIRS[action],r=Math.floor(t.player/6)+dr,c=t.player%6+dc;if(r<0||r>=6||c<0||c>=6)return null;const newpos=r*6+c;if(walls.has(newpos)||t.balls.some((x,i)=>!t.filled.includes(i)&&x===newpos))return null;t.player=newpos}t.moves++;
const selected=[];for(const [dr,dc] of DIRS){let r=Math.floor(t.player/6)+dr,c=t.player%6+dc;while(r>=0&&r<6&&c>=0&&c<6){let pos=r*6+c;if(walls.has(pos))break;let i=t.balls.findIndex((x,j)=>x===pos&&!t.filled.includes(j));if(i!==-1){selected.push([i,dr,dc]);break}r+=dr;c+=dc}}
let moving=new Map(selected.map(([i,dr,dc])=>[i,level.pols[i]===t.mag?[dr,dc]:[-dr,-dc]]));const paths=Object.fromEntries(selected.map(([i])=>[i,[]]));for(let k=0;k<7;k++){let intent=new Map();for(const [i,[dr,dc]] of moving){const r=Math.floor(t.balls[i]/6)+dr,c=t.balls[i]%6+dc;if(r>=0&&r<6&&c>=0&&c<6){const pos=r*6+c;if(!walls.has(pos)&&pos!==t.player)intent.set(i,pos)}}let changed=true;while(changed){changed=false;const counts=new Map();for(const dest of intent.values())counts.set(dest,(counts.get(dest)||0)+1);for(const [i,dest] of intent){const other=t.balls.findIndex((x,j)=>j!==i&&!t.filled.includes(j)&&x===dest);if(counts.get(dest)>1||(other!==-1&&!intent.has(other))){intent.delete(i);changed=true}}}if(intent.size===0)break;const oldFilledGoals=new Set(t.filled.map(i=>t.balls[i]));for(const [i,dest] of intent){t.balls[i]=dest;paths[i].push(dest)}for(const [i,dest] of intent){if(goals.has(dest)&&!oldFilledGoals.has(dest))t.filled.push(i)}moving=new Map([...moving].filter(([i])=>intent.has(i)&&!t.filled.includes(i)))}return {state:t,active:selected.map(([i])=>i),paths}}
function effectAt(type,pos,text){const el=document.createElement('div');el.className=type;el.textContent=text||'';if(pos!==null){el.style.setProperty('--row',Math.floor(pos/6));el.style.setProperty('--col',pos%6)}board.append(el);setTimeout(()=>el.remove(),800)}
function pulseAt(pos){board.style.setProperty('--pulse-row',Math.floor(pos/6));board.style.setProperty('--pulse-col',pos%6);board.classList.remove('pulse-hit');void board.offsetWidth;board.classList.add('pulse-hit');setTimeout(()=>board.classList.remove('pulse-hit'),260)}
function act(action){if(busy||lock)return;let output=nextState(state,action,LEVELS[levelIndex]);if(!output){toast('이쪽으로는 이동할 수 없어요');return}history.push(copy(state));const before=history[history.length-1];state=output.state;busy=true;render(true,output.active);pulseAt(state.player);
const newly=state.filled.filter(i=>!before.filled.includes(i));

function undo(){if(!history.length||busy||lock)return;state=history.pop();render()}
function reset(){if(busy)return;state=initial(LEVELS[levelIndex]);history=[];lock=false;overlay.replaceChildren();render()}
function starCount(){const ideal=LEVELS[levelIndex].optimal;return state.moves<=ideal?3:state.moves<=ideal+3?2:1}
function showWin(){let stars=starCount();saved.stars[levelIndex]=Math.max(saved.stars[levelIndex]||0,stars);saved.unlocked=Math.max(saved.unlocked,Math.min(levelIndex+2,LEVELS.length));save();overlay.innerHTML=`<div class="modal-back"><div class="modal win"><div class="confetti">${Array.from({length:22},(_,i)=>`<i style="--x:${(i*37+9)%97}%;--c:${['#ef6b6d','#5a94df','#f2bb55','#53a187'][i%4]};--delay:${(i%6)*.042}s;--duration:${.65+(i%5)*.11}s;--rot:${i*29}deg;--drift:${(i%2?1:-1)*(10+i%4*8)}px"></i>`).join('')}</div><div class="win-mascot">${MASCOT_SVG}</div><h2>퍼즐 해결!</h2><div class="stars celebrate">${'★'.repeat(stars)}<span style="color:#e9e2d0">${'★'.repeat(3-stars)}</span></div><p><b>${state.moves}턴</b> 만에 모든 구슬을 넣었어요!<br>최소 턴 기록: ${LEVELS[levelIndex].optimal}턴</p><div class="modal-actions"><button class="secondary" id="winRetry">다시 도전</button><button class="primary" id="winNext">${levelIndex===LEVELS.length-1?'스테이지 선택':'다음 스테이지 →'}</button></div></div></div>`;document.getElementById('winRetry').onclick=()=>loadLevel(levelIndex);document.getElementById('winNext').onclick=()=>levelIndex===LEVELS.length-1?showLevels():loadLevel(levelIndex+1)}
function showLevels(){if(busy)return;overlay.innerHTML=`<div class="modal-back" id="modalBack"><div class="modal"><button class="close" id="closeLevels" aria-label="닫기">✕</button><div class="win-mascot" style="height:88px"><img class="mascot-art" style="width:88px;height:88px;margin:auto" src="assets/jaseogi.png" alt="자석이"></div><h2>스테이지 선택</h2><p>자석이와 함께 퍼즐을 해결해요!</p>${[0,10].map((start,w)=>`<div class="stage-head">${w===0?'WORLD 01 · 자석 연구소':'WORLD 02 · 극성 실험실'}</div><div class="levels-grid">${LEVELS.slice(start,start+10).map((_,j)=>{let i=start+j;return `<button class="level-btn ${i===levelIndex?'current':''} ${i>=saved.unlocked?'locked':''}" data-lv="${i}" ${i>=saved.unlocked?'disabled':''}>${i>=saved.unlocked?'🔒':i+1}<span class="tiny">${'★'.repeat(saved.stars[i]||0)}</span></button>`}).join('')}</div>`).join('')}<div class="tutorial-card">🔴 N극 · 🔵 S극<br>서로 같은 극이면 밀고, 다르면 당겨요.<br>구슬을 구멍에 모두 넣으면 성공!</div></div></div>`;document.getElementById('closeLevels').onclick=()=>overlay.replaceChildren();document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>loadLevel(Number(b.dataset.lv)));document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')overlay.replaceChildren()})}
let toastTimer;function toast(message){document.querySelector('.notification')?.remove();let el=document.createElement('div');el.className='notification';el.textContent=message;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),1900)}
let start=null;board.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY,time:Date.now()}});board.addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.hypot(dx,dy)>20){act(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))}else if(e.target.closest('.player')){}else{let rect=board.getBoundingClientRect(),gap=4,pad=5,unit=(rect.width-10-5*gap)/6;let col=Math.floor((e.clientX-rect.left-pad)/(unit+gap)),row=Math.floor((e.clientY-rect.top-pad)/(unit+gap)),pr=Math.floor(state.player/6),pc=state.player%6;let deltaR=row-pr,deltaC=col-pc;if(deltaR===0&&Math.abs(deltaC)===1)act(deltaC>0?1:3);else if(deltaC===0&&Math.abs(deltaR)===1)act(deltaR>0?2:0)}start=null});board.addEventListener('pointercancel',()=>start=null);
document.addEventListener('keydown',e=>{if(overlay.children.length)return;const map={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,' ':4,Enter:4};if(map[e.key]!==undefined){e.preventDefault();act(map[e.key])}else if(e.key==='Backspace'){e.preventDefault();undo()}else if(e.key==='r'||e.key==='R')reset()});document.getElementById('undo').onclick=undo;document.getElementById('flip').onclick=()=>act(4);document.getElementById('restart').onclick=reset;document.getElementById('selectLevel').onclick=showLevels;loadLevel(0);
